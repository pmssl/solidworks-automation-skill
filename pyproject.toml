[project]
name = "solidworks-automation-skill"
version = "1.3.0"
description = "Python and COM skill for native SolidWorks part modeling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "wzyn20051216" }
]
dependencies = [
  "pywin32>=305; sys_platform == 'win32'",
  "comtypes>=1.2.0; sys_platform == 'win32'"
]

[project.urls]
Homepage = "https://github.com/pmssl/solidworks-automation-skill"
Repository = "https://github.com/pmssl/solidworks-automation-skill"
Issues = "https://github.com/pmssl/solidworks-automation-skill/issues"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
